<meta name="color-scheme" content="light dark">
<script>
  /* Se aplica antes de pintar nada para que al abrir no dé un fogonazo. */
  try{ if(localStorage.getItem("tema_app") === "claro") document.documentElement.classList.add("claro"); }catch(e){}
</script>
<title>Peticiones Fábrica 1</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#14171c;
    --bg-2:#171b21;
    --bg-rgb:20,23,28;
    --panel:#1c2129;
    --panel-2:#232a34;
    --line:#323a46;
    --amber:#e8a23d;
    --amber-dim:#7a5a26;
    --on-amber:#141414;
    --text:#eef1f5;
    --text-dim:#98a3b3;
    --green:#4caf7d;
    --red:#ff5a5a;
    --radius:10px;
  }
  html.claro{
    color-scheme:light;
    --bg:#f2f5f9;
    --bg-2:#ffffff;
    --bg-rgb:242,245,249;
    --panel:#ffffff;
    --panel-2:#e9edf3;
    --line:#c4cdd9;

  .pista{padding:8px 14px 0;font-size:11.5px;color:var(--text-dim);line-height:1.4;}

  }

// ---------- AVISOS ----------
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.classList.remove("show"), 2200);
}

// ---------- FONDO CLARO U OSCURO ----------
const TEMA_KEY = "tema_app";
let temaActual = "oscuro";
try{ temaActual = localStorage.getItem(TEMA_KEY) || "oscuro"; }catch(e){}
function aplicarTema(){
  const claro = temaActual === "claro";
  document.documentElement.classList.toggle("claro", claro);
  const b = document.getElementById("temaBtn");
  b.textContent = claro ? "\u{1F319}" : "☀️";
  b.title = claro ? "Cambiar a fondo oscuro" : "Cambiar a fondo claro";
}
aplicarTema();
document.getElementById("temaBtn").addEventListener("click", ()=>{
  temaActual = (temaActual === "claro") ? "oscuro" : "claro";
  try{ localStorage.setItem(TEMA_KEY, temaActual); }catch(e){}
  aplicarTema();
});

// ---------- NÚMEROS DICHOS EN VOZ ----------
// Mismo reconocimiento que en Almacén Schnellecke: entiende tanto "ocho cinco
// uno" como "ochocientos cincuenta y uno", y las letras sueltas del final.
const WORD_NUM = {
  "cero":0,"uno":1,"una":1,"dos":2,"tres":3,"cuatro":4,"cinco":5,"seis":6,"siete":7,"ocho":8,"nueve":9,
  "diez":10,"once":11,"doce":12,"trece":13,"catorce":14,"quince":15,
  "dieciseis":16,"diecisiete":17,"dieciocho":18,"diecinueve":19,
  "veinte":20,"veintiuno":21,"veintidos":22,"veintitres":23,"veinticuatro":24,"veinticinco":25,
  "veintiseis":26,"veintisiete":27,"veintiocho":28,"veintinueve":29,
  "treinta":30,"cuarenta":40,"cincuenta":50,"sesenta":60,"setenta":70,"ochenta":80,"noventa":90,
  "cien":100,"ciento":100,"doscientos":200,"trescientos":300,"cuatrocientos":400,"quinientos":500,
  "seiscientos":600,"setecientos":700,"ochocientos":800,"novecientos":900
};
function parseSpokenNumber(transcript){
  const tokens = transcript.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
  const groups = [];
  let current = null, pendingY = false;
  tokens.forEach(tok=>{
    if(tok === "y"){ pendingY = true; return; }
    let val = null;
    if(/^\d+$/.test(tok)) val = parseInt(tok,10);
    else if(tok in WORD_NUM) val = WORD_NUM[tok];
    if(val !== null){
      const canAdd = current !== null && (pendingY || (current>=100 && current%100===0));
      if(canAdd) current += val;
      else{ if(current!==null) groups.push(String(current)); current = val; }
      pendingY = false;
      return;
    }
    if(/^[a-e]$/.test(tok)){
      if(current!==null){ groups.push(String(current)); current=null; }
      groups.push(tok.toUpperCase());
      pendingY = false;
      return;
    }
    if(current!==null){ groups.push(String(current)); current=null; }
    pendingY = false;
  });
  if(current!==null) groups.push(String(current));
  return groups.join("");
}
function limpiaBusqueda(s){ return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }

// ---------- BÚSQUEDA ----------
// Primero busca los materiales que acaban exactamente por lo que has dicho.
// Si no hay ninguno, prueba ignorando la letra final, por si has dicho solo
// los números de una referencia que termina en letra.
function soloDigitos(s){ return String(s).replace(/[^0-9]/g, ""); }
function buscar(q){
  const Q = limpiaBusqueda(q);
  if(Q.length < 2) return [];
  // 1) los que acaban exactamente por lo dicho
  const salen = DATOS.filter(d=> d.mat.endsWith(Q));
  // 2) y además los que coinciden en dígitos aunque acaben en letra:
  //    diciendo "301" tiene que salir también la 2G7813301A
  const qd = soloDigitos(Q);
  if(qd.length >= 3){
    DATOS.forEach(d=>{
      if(salen.indexOf(d) === -1 && soloDigitos(d.mat).endsWith(qd)) salen.push(d);
    });
  }
  return salen;
}

const resultadosEl = document.getElementById("resultados");
function pintar(lista, consulta){
  if(!consulta){
    resultadosEl.innerHTML = "";
    return;
  }
  if(!lista.length){
    resultadosEl.innerHTML = `<div class="vacio">No hay ningún material que acabe en <b>${consulta}</b>.<br>Prueba con otros dígitos o mira la lista completa.</div>`;
    return;
  }
  resultadosEl.innerHTML = lista.map(d=>`
    <div class="tarjeta">
      <div class="mat">${d.mat}</div>
      <div class="ciclo-lbl">CICLO DE CONTROL</div>
      <div class="ciclo">${d.ciclo}</div>
      <div class="extra">Ruta ${d.ruta} · ${d.ubic} · columna ${d.col}${d.cont ? " · contenedor " + d.cont : ""} · capacidad ${d.cap}</div>
      <button class="copiar" data-ciclo="${d.ciclo}">Copiar ${d.ciclo}</button>
    </div>
  `).join("");
  if(lista.length > 1) showToast(lista.length + " materiales acaban igual");
}

resultadosEl.addEventListener("click", e=>{
  const b = e.target.closest(".copiar");
  if(!b) return;
  const v = b.dataset.ciclo;
  try{
    navigator.clipboard.writeText(v);
    showToast("Copiado " + v);
  }catch(err){ showToast("No se ha podido copiar · apúntalo a mano"); }
});

const txtEl = document.getElementById("txt");
function lanzar(q){
  const Q = limpiaBusqueda(q);
  txtEl.value = Q;
  pintar(buscar(Q), Q);
}
txtEl.addEventListener("input", ()=> pintar(buscar(txtEl.value), limpiaBusqueda(txtEl.value)));
document.getElementById("limpiar").addEventListener("click", ()=>{
  txtEl.value = "";
  pintar([], "");
  txtEl.focus();
});

// ---------- MICRÓFONO ----------
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById("micBtn");
let rec = null;
if(Rec){
  rec = new Rec();
  rec.lang = "es-ES";
  rec.continuous = false;
  rec.interimResults = false;
  rec.maxAlternatives = 4;
  rec.addEventListener("start", ()=>{
    micBtn.classList.add("listening");
    showToast("Escuchando… di los últimos dígitos");
  });
  rec.addEventListener("end", ()=> micBtn.classList.remove("listening"));
  rec.addEventListener("error", ()=>{
    micBtn.classList.remove("listening");
    showToast("El micrófono no va aquí · escríbelo abajo");
  });
  rec.addEventListener("result", e=>{
    const alts = [];
    for(let i = 0; i < e.results[0].length; i++) alts.push(e.results[0][i].transcript);
    // nos quedamos con la primera alternativa que encuentre algo
    for(const a of alts){
      const q = limpiaBusqueda(parseSpokenNumber(a));
      if(q && buscar(q).length){ lanzar(q); return; }
    }
    const q = limpiaBusqueda(parseSpokenNumber(alts[0]));
    lanzar(q || alts[0]);
  });
}
micBtn.addEventListener("click", ()=>{
  if(!rec){ showToast("Este navegador no deja dictar · escríbelo abajo"); txtEl.focus(); return; }
  try{ rec.abort(); }catch(e){}
  try{ rec.start(); }catch(e){}
});

// ---------- LISTA COMPLETA ----------
const todoBtn = document.getElementById("todoBtn");
const listaEl = document.getElementById("listaTodo");
let abierta = false;
todoBtn.addEventListener("click", ()=>{
  abierta = !abierta;
  todoBtn.textContent = abierta ? "Ocultar la lista" : "Ver la lista completa";
  listaEl.style.display = abierta ? "block" : "none";
  if(abierta && !listaEl.innerHTML){
    const filas = DATOS.slice().sort((a,b)=> a.mat.localeCompare(b.mat)).map(d=>`
      <tr class="fila" data-q="${d.mat}">
        <td>${d.mat}</td><td class="ru">Ruta ${d.ruta}</td><td class="ci">${d.ciclo}</td>
      </tr>`).join("");
    listaEl.innerHTML = `<table>
      <thead><tr><th>Material</th><th></th><th style="text-align:right">Ciclo</th></tr></thead>
      <tbody>${filas}</tbody></table>`;
  }
});
listaEl.addEventListener("click", e=>{
  const tr = e.target.closest(".fila");
  if(!tr) return;
  lanzar(tr.dataset.q);
